<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b5b95"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#c9bfe6;stroke-width:2;rx:14}
      .hd{font-size:20px;font-weight:700;fill:#2d2440}
      .t{font-size:15px;fill:#3d3552}
      .s{font-size:13px;fill:#7a7290}
      .ln{stroke:#6b5b95;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:6 5}
      .tag{font-size:13px;font-weight:700;fill:#6b5b95}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f4fd"/>
  <text x="40" y="52" font-size="28" font-weight="800" fill="#2d2440">분신으로 자동답장 · 프로젝트 플로우</text>
  <text x="40" y="80" class="s">텔레그램 1:1 채팅방별 AI 자동 답장 — 내 말투와 기억으로, 내가 바쁠 때 대신 답합니다</text>

  <!-- Row 1: user / frontend / backend -->
  <rect class="box" x="40" y="110" width="250" height="150"/>
  <text x="60" y="142" class="hd">👤 사용자 (브라우저)</text>
  <text x="60" y="172" class="t">① 텔레그램 계정 로그인</text>
  <text x="60" y="196" class="t">② 채팅방 목록에서 ON/OFF</text>
  <text x="60" y="220" class="t">③ 대기 시간 · AI 지침 설정</text>
  <text x="60" y="244" class="t">④ 기록 보기 · 내려받기</text>

  <rect class="box" x="350" y="110" width="250" height="150"/>
  <text x="370" y="142" class="hd">🖥 Frontend</text>
  <text x="370" y="172" class="t">React + Vite + TS</text>
  <text x="370" y="196" class="t">localhost:5173</text>
  <text x="370" y="220" class="s">메인 · 로그인 · 채팅방·기록 · 설정</text>
  <text x="370" y="244" class="s">/api → Vite 프록시</text>

  <rect class="box" x="660" y="110" width="500" height="150"/>
  <text x="680" y="142" class="hd">⚙️ Backend · FastAPI (127.0.0.1:8080)</text>
  <text x="680" y="172" class="t">ClientManager: 사용자별 Telethon 클라이언트</text>
  <text x="680" y="196" class="t">디바운스 답장 · 메시지 기록 · 세션 추출(JSON/CSV/TXT)</text>
  <text x="680" y="220" class="t">SQLite + Fernet 암호화(세션, api_hash)</text>
  <text x="680" y="244" class="s">backend/data/: 켜진 채팅방의 대화 JSON · 분석 결과 (끄면 삭제)</text>

  <path class="ln" d="M290 185H346"/>
  <path class="ln" d="M600 185H656"/>

  <!-- Row 2: telegram / ai -->
  <rect class="box" x="40" y="330" width="420" height="170"/>
  <text x="60" y="362" class="hd">✈️ Telegram (MTProto, 사용자 계정)</text>
  <text x="60" y="392" class="t">상대 메시지 수신 → NewMessage 이벤트</text>
  <text x="60" y="416" class="t">AI 답장을 말풍선처럼 줄마다 전송</text>
  <text x="60" y="440" class="t">내가 직접 답하면 대기 중 AI 답장 취소</text>
  <text x="60" y="464" class="t">🚨/❓ 판단 시 "저장된 메시지"로 알림</text>
  <text x="60" y="488" class="s">1:1 채팅만 · 봇/그룹/채널 제외</text>

  <rect class="box" x="560" y="330" width="600" height="170"/>
  <text x="580" y="362" class="hd">🧠 AI 모듈 (backend/app/ai)</text>
  <text x="580" y="392" class="t">ON → 최근 대화 1000개를 JSON으로 저장 → 분석</text>
  <text x="600" y="416" class="t">· 말투 (style.md): 최근 500개</text>
  <text x="600" y="440" class="t">· 기억 (memory.md): 약속 · 사건 · 상대 정보</text>
  <text x="580" y="464" class="t">답장 = 말투 + 기억 + 최근 150개 + 채팅방 지침</text>
  <text x="580" y="488" class="t">판단기: 비상상황(심각도) · 주인 확인 필요</text>

  <path class="ln" d="M780 260V300H250V326"/>
  <text x="470" y="294" class="tag">Telethon</text>
  <path class="ln" d="M960 260V326"/>
  <text x="972" y="300" class="tag">generate_persona_reply</text>

  <!-- Row 3: GPU -->
  <rect class="box" x="560" y="570" width="600" height="130" style="stroke:#9b8ad0"/>
  <text x="580" y="602" class="hd">🎛 GPU 서버 · vLLM (OpenAI 호환 API)</text>
  <text x="580" y="632" class="t">Qwen3.8-27B · thinking off · 127.0.0.1:8000</text>
  <text x="580" y="656" class="t">로컬 PC에서 SSH 터널로만 접속 (API 키 없음)</text>
  <text x="580" y="680" class="s">ssh -N -L 8000:localhost:8000 &lt;user&gt;@&lt;GPU 서버&gt;</text>
  <path class="ln dash" d="M860 500V566"/>
  <text x="872" y="540" class="tag">SSH 터널</text>

  <!-- Reply timeline -->
  <rect class="box" x="40" y="570" width="470" height="154"/>
  <text x="60" y="602" class="hd">⏱ 답장 타임라인</text>
  <text x="60" y="632" class="t">상대 메시지 → 대기 5~120초 (새 메시지 오면 재시작)</text>
  <text x="60" y="656" class="t">→ 말투·기억 분석 중이면 끝날 때까지 기다림</text>
  <text x="60" y="680" class="t">→ 판단 + 답장 생성 → 말풍선 전송 (1.2초 간격)</text>
  <text x="60" y="704" class="t">→ 필요하면 5초 뒤 나에게 알림 · 실패 시 대체 문구</text>
</svg>
